<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173c2b">
<title>A Little Sorry for Deena 💌</title>
<style>
  :root { --cream:#fff4dc; --ink:#294333; --pink:#ff8e9e; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    min-height:100svh; overflow:hidden; display:grid; place-items:center;
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; color:var(--cream);
    background: radial-gradient(ellipse at 50% 20%, #5c9463 0, #27563e 38%, #102b25 100%);
  }
  .scene { position:relative; width:100%; height:100svh; min-height:520px; overflow:hidden; isolation:isolate; }
  .sun { position:absolute; width:clamp(90px,18vw,190px); aspect-ratio:1; border-radius:50%; background:#ffe8a7; filter:blur(2px); opacity:.8; top:7%; left:62%; box-shadow:0 0 70px 25px #ffd98266; }
  .forest { position:absolute; inset:0; pointer-events:none; }
  .tree { position:absolute; bottom:12%; width:clamp(65px,15vw,150px); height:90%; opacity:.85; }
  .tree:before { content:""; position:absolute; left:42%; top:0; width:16%; height:100%; background:linear-gradient(90deg,#18382b,#3d6040,#18382b); border-radius:50% 50% 0 0; }
  .tree:after { content:""; position:absolute; left:-20%; top:4%; width:140%; height:43%; background:#214a35; clip-path:polygon(50% 0,100% 45%,75% 40%,100% 85%,0 85%,25% 42%,0 47%); filter:drop-shadow(0 8px 8px #09231966); }
  .tree.t1{left:-3%;transform:scale(1.15)} .tree.t2{left:13%;transform:scale(.72);opacity:.65}
  .tree.t3{right:4%;transform:scale(1.05)} .tree.t4{right:20%;transform:scale(.68);opacity:.6}
  .ground { position:absolute; bottom:-7%; left:-10%; width:120%; height:33%; border-radius:50% 50% 0 0; background:linear-gradient(#4d8050,#173e30 65%); box-shadow:0 -20px 50px #b2d87918; }
  .path { position:absolute; bottom:-10%; left:28%; width:48%; height:37%; background:linear-gradient(#b8a071,#65573d); clip-path:polygon(35% 0,65% 0,100% 100%,0 100%); opacity:.72; }
  .firefly { position:absolute; width:5px;height:5px;border-radius:50%;background:#fff4a9;box-shadow:0 0 12px 3px #fff4a977;animation:twinkle 2s infinite alternate; }
  .f1{left:14%;top:35%}.f2{left:78%;top:44%;animation-delay:.6s}.f3{left:27%;top:63%;animation-delay:1s}.f4{left:86%;top:26%;animation-delay:.3s}
  @keyframes twinkle {to{opacity:.2;transform:scale(.5)}}
  .intro { position:absolute; top:7%; left:5%; right:5%; text-align:center; z-index:3; text-shadow:0 2px 14px #082219; }
  .intro h1 { font-size:clamp(1.4rem,5vw,2.5rem); margin:0 0 .4rem; letter-spacing:.02em; }
  .intro p { margin:0; font-size:clamp(.85rem,2.8vw,1.05rem); opacity:.92; }
  .flight-area { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .plane { position:absolute; width:clamp(75px,17vw,125px); left:-25%; top:43%; filter:drop-shadow(0 8px 6px #081d1570); transform-origin:center; animation:fly 5s cubic-bezier(.35,.02,.3,1) forwards; }
  .plane svg { width:100%; height:auto; display:block; }
  @keyframes fly {
    0%{left:-25%;top:48%;transform:rotate(-8deg) scale(.8)}
    22%{left:18%;top:31%;transform:rotate(8deg) scale(1)}
    42%{left:48%;top:38%;transform:rotate(-4deg) scale(.9)}
    63%{left:72%;top:26%;transform:rotate(13deg) scale(.82)}
    80%{left:59%;top:52%;transform:rotate(25deg) scale(.76)}
    100%{left:calc(50% - 40px);top:68%;transform:rotate(80deg) scale(.65);opacity:0}
  }
  .trail { position:absolute; left:0;top:0;width:100%;height:100%; }
  .trail path { fill:none;stroke:#fff4dc;stroke-width:2.5;stroke-dasharray:4 9;stroke-linecap:round;opacity:.65; }
  .note-wrap { position:absolute; z-index:5; left:50%; top:54%; width:min(84vw,430px); transform:translate(-50%,-50%) scale(.55) rotate(-5deg); opacity:0; perspective:900px; }
  .note { position:relative; width:100%; min-height:210px; padding:clamp(20px,5vw,35px); border-radius:5px 12px 7px 10px; color:#5b382c; text-align:center; background:linear-gradient(135deg,#fff8e8,#f4dfb8); box-shadow:0 18px 35px #071e16a6; border:1px solid #e8cfa0; overflow:hidden; }
  .note:before { content:"";position:absolute;inset:10px;border:1px dashed #d6b78d;border-radius:5px;pointer-events:none; }
  .note .heart { font-size:clamp(1.4rem,5vw,2rem); margin:0 0 8px; }
  .note h2 { position:relative; margin:0; font-family:"Brush Script MT","Segoe Script",cursive; font-size:clamp(2rem,8vw,3.1rem); line-height:1.15; font-weight:700; }
  .note p { position:relative;margin:12px 0 0;font-size:clamp(1rem,3.5vw,1.15rem); }
  .doodle { position:relative; margin-top:8px; font-size:1.25rem; }
  .note-wrap.open { animation:unfold 1.25s cubic-bezier(.2,.8,.2,1) 5s forwards; }
  @keyframes unfold { 0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(30deg)} 55%{opacity:1;transform:translate(-50%,-50%) scale(1.04) rotate(-3deg)} 75%{transform:translate(-50%,-50%) scale(.98) rotate(2deg)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-1deg)} }
  .fold { position:absolute; inset:0; background:linear-gradient(135deg,#f2d7a6,#fff0d1); clip-path:polygon(0 0,100% 0,50% 55%); transform-origin:top; animation:flap 1s ease-in 5s forwards; z-index:2; opacity:1; }
  @keyframes flap { 0%{transform:rotateX(0deg);opacity:1} 70%{opacity:1} 100%{transform:rotateX(180deg);opacity:0} }
  .restart { position:absolute;z-index:8;bottom:22px;left:50%;transform:translateX(-50%);border:1px solid #ffffff55;border-radius:999px;padding:12px 20px;background:#fff4dc18;color:#fff8e8;font:inherit;font-weight:700;backdrop-filter:blur(10px);cursor:pointer; }
  .restart:active{transform:translateX(-50%) scale(.97)}
  .hint { position:absolute;bottom:76px;left:5%;right:5%;text-align:center;font-size:.8rem;opacity:.8;z-index:3; }
  @media (max-height:600px){.intro{top:3%}.note-wrap{top:53%;width:min(78vw,380px)}.note{min-height:175px;padding:20px}.hint{bottom:66px}}
  @media (prefers-reduced-motion:reduce){.firefly{animation:none}.plane{animation-duration:1s}.note-wrap.open{animation-duration:.3s;animation-delay:1s}.fold{animation-delay:1s}}
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="A paper plane flies through a forest and unfolds into a love note">
  <div class="sun"></div>
  <div class="forest">
    <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div>
    <div class="ground"></div><div class="path"></div>
    <span class="firefly f1"></span><span class="firefly f2"></span><span class="firefly f3"></span><span class="firefly f4"></span>
  </div>
  <header class="intro">
    <h1>A little note for you 🌿</h1>
    <p>Somewhere in this forest, a tiny apology is on its way…</p>
  </header>
  <div class="flight-area">
    <svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M -5 55 C 10 25, 22 25, 32 40 S 49 56, 60 38 S 78 22, 70 49 S 57 60, 50 72"/></svg>
    <div class="plane" id="plane" aria-hidden="true">
      <svg viewBox="0 0 140 90" role="img" aria-label="Paper plane with a tiny heart">
        <path d="M8 35 L132 7 L80 82 L62 49 Z" fill="#fff0d5" stroke="#d6b78d" stroke-width="1.5"/>
        <path d="M8 35 L62 49 L132 7 Z" fill="#fff9e9"/>
        <path d="M62 49 L80 82 L88 40 L132 7 Z" fill="#e9d1a9"/>
        <path d="M62 49 L132 7" stroke="#d0ad7e" stroke-width="1"/>
        <text x="71" y="43" font-size="15" fill="#e65f71" text-anchor="middle">♥</text>
      </svg>
    </div>
  </div>
  <div class="note-wrap" id="noteWrap">
    <article class="note">
      <div class="fold"></div>
      <div class="heart">💗</div>
      <h2>Sorry Deena,</h2>
      <h2>I love you!</h2>
      <p>Can we make up? 🥺</p>
      <div class="doodle">♡  🌼  ♡</div>
    </article>
  </div>
  <p class="hint" id="hint">Wait for it… ✨</p>
  <button class="restart" id="restart" type="button">↻ Watch it again</button>
</main>
<script>
  const plane = document.getElementById('plane');
  const noteWrap = document.getElementById('noteWrap');
  const hint = document.getElementById('hint');
  const restart = document.getElementById('restart');
  let timers = [];
  function play() {
    timers.forEach(clearTimeout); timers = [];
    plane.style.animation = 'none';
    noteWrap.classList.remove('open');
    noteWrap.style.opacity = '0';
    hint.textContent = 'Wait for it… ✨';
    void plane.offsetWidth;
    plane.style.animation = '';
    timers.push(setTimeout(() => {
      noteWrap.classList.add('open');
      hint.textContent = 'A little sorry, with a lot of love 💗';
    }, 5000));
  }
  restart.addEventListener('click', play);
  play();
</script>
</body>
</html>
