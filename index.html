<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I'm Sorry, Deena ♡</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:linear-gradient(145deg,#fff0e7,#e8def4);font-family:system-ui,sans-serif;color:#70475f}.card{width:min(900px,100%);border:5px solid white;border-radius:28px;overflow:hidden;background:#fff9f0;box-shadow:0 20px 55px #7d547333}.head{text-align:center;padding:18px 12px 8px}h1{font:italic 500 clamp(2rem,6vw,3.4rem) Georgia;color:#a45d87;margin:0;text-shadow:2px 3px white}.head p{margin:8px auto;color:#8b7287}.scene{position:relative;aspect-ratio:4/3;min-height:390px;overflow:hidden;background:linear-gradient(#f6d8d0 0 68%,#b98fa3 68%)}.window{position:absolute;left:7%;top:8%;width:27%;height:43%;border:10px solid #c18ca6;border-radius:13px;background:linear-gradient(#b8dce8,#fff0c7);box-shadow:inset 0 0 0 5px #fff7e8}.window:before,.window:after{content:"";position:absolute;background:#fff8e9}.window:before{left:48%;top:0;width:7px;height:100%}.window:after{top:52%;left:0;width:100%;height:7px}.sun{position:absolute;right:12%;top:10%;width:42px;height:42px;background:#fff3b4;border-radius:50%;box-shadow:0 0 30px #fff4b8}.rug{position:absolute;left:18%;bottom:3%;width:65%;height:20%;border-radius:50%;background:#e6c1d1;border:8px solid #fbe4e6}.phone{position:absolute;left:11%;bottom:12%;width:13%;height:20%;border:4px solid white;border-radius:14px;background:linear-gradient(#eaa5c1,#fff0dc);box-shadow:0 9px 15px #644a6430;transform:rotate(-17deg);z-index:4;transition:1s}.phone:after{content:"♡";display:grid;place-items:center;height:100%;font-size:32px;color:white}.caption{position:absolute;z-index:9;top:4%;left:5%;right:5%;text-align:center;font:italic clamp(18px,3.4vw,29px) Georgia;color:#a45d87;text-shadow:0 2px white}.person{position:absolute;bottom:14%;width:27%;height:55%;transition:1s cubic-bezier(.2,.8,.2,1);z-index:3}.deena{left:35%}.vidhun{left:66%;opacity:0;transform:translateY(55px) scale(.8);filter:drop-shadow(0 0 16px #9de0ff)}.tag{position:absolute;top:-3%;left:12%;z-index:8;white-space:nowrap;padding:5px 12px;background:#ed8fb8;color:white;border:3px solid white;border-radius:22px;font-weight:800}.face{position:absolute;top:2%;left:22%;width:56%;height:42%;border-radius:46%;background:#ffd1ad;border:4px solid #513346;z-index:4}.hair{position:absolute;top:-8%;left:-5%;width:110%;height:52%;border-radius:55% 55% 30% 30%;background:#38283d}.hair:after{content:"";position:absolute;right:5%;top:20%;width:25%;height:85%;border-radius:50%;background:#38283d}.eye{position:absolute;top:53%;width:8%;height:10%;border-radius:50%;background:#422b3a;z-index:6}.eye.l{left:27%}.eye.r{right:27%}.cheek{position:absolute;top:65%;width:18%;height:8%;border-radius:50%;background:#f29bb0;z-index:6}.cheek.l{left:8%}.cheek.r{right:8%}.mouth{position:absolute;top:72%;left:41%;width:19%;height:7%;border-bottom:3px solid #a85b79;border-radius:0 0 50% 50%;z-index:6}.body{position:absolute;top:41%;left:20%;width:60%;height:37%;border:4px solid #fff1e7;border-radius:28px 28px 12px 12px;background:#e99ab9}.skirt{position:absolute;top:64%;left:14%;width:72%;height:23%;background:#aaa4d4;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);border-bottom:4px solid white}.arm{position:absolute;top:48%;width:16%;height:30%;background:#ffd1ad;border-radius:20px;z-index:1;transform-origin:top center}.arm.l{left:10%;transform:rotate(20deg)}.arm.r{right:10%;transform:rotate(-20deg)}.leg{position:absolute;top:83%;width:16%;height:14%;background:#ffd1ad;border-radius:0 0 10px 10px}.leg.l{left:34%}.leg.r{right:34%}.glasses{position:absolute;z-index:7;top:43%;left:10%;width:80%;height:19%}.glasses:before,.glasses:after{content:"";position:absolute;top:0;width:43%;height:100%;border:3px solid #43394b;border-radius:8px;background:#dff7ff20}.glasses:before{left:0}.glasses:after{right:0}.bridge{position:absolute;left:44%;top:24%;width:12%;height:3px;background:#43394b}.beard{position:absolute;z-index:5;left:9%;top:58%;width:82%;height:40%;background:#352c38;clip-path:polygon(0 0,100% 0,88% 65%,68% 100%,32% 100%,12% 65%);border-radius:0 0 45% 45%}.beard:after{content:"";position:absolute;left:22%;top:0;width:56%;height:50%;background:#ffd1ad;border-radius:0 0 50% 50%}.vidhun .face{background:#d8f1ff;border-color:white;box-shadow:0 0 20px #a6dfff}.vidhun .hair,.vidhun .hair:after{background:#302936}.vidhun .body{background:#a9dfffaa;border-color:white;box-shadow:0 0 25px #a6dfff}.vidhun .arm,.vidhun .leg{background:#bdeaffcc}.vidhun .tag{background:#85c9ee}.vidhun .mouth{border-color:#4c9ac4}.puppy{position:absolute;left:17%;bottom:13%;width:20%;height:20%;z-index:6;transition:1s}.puphead{position:absolute;left:15%;top:0;width:70%;height:76%;background:#d8a779;border:3px solid #fff2e5;border-radius:45%}.ear{position:absolute;top:7%;width:30%;height:55%;background:#9a654f;border-radius:50%;z-index:-1}.ear.l{left:-12%;transform:rotate(-25deg)}.ear.r{right:-12%;transform:rotate(25deg)}.peye{position:absolute;top:37%;width:8%;height:10%;background:#392c35;border-radius:50%}.peye.l{left:28%}.peye.r{right:28%}.nose{position:absolute;top:52%;left:43%;width:14%;height:10%;background:#392c35;border-radius:50%}.pmouth{position:absolute;top:61%;left:40%;width:20%;height:13%;border-bottom:2px solid #392c35;border-radius:50%}.tear{position:absolute;top:33%;left:45%;font-size:25px;opacity:0}.sparkles{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(white 1.5px,transparent 2px),radial-gradient(#fff8c9 2px,transparent 3px);background-size:70px 80px,113px 105px;opacity:.45;animation:twinkle 3s infinite alternate}@keyframes twinkle{to{opacity:.9;transform:translateY(-5px)}}.heart{position:absolute;z-index:10;color:white;font-size:28px;opacity:0;animation:float 2.4s ease-in-out infinite}@keyframes float{0%{transform:translateY(8px) scale(.7);opacity:0}35%{opacity:1}100%{transform:translateY(-60px) scale(1.2);opacity:0}}.scene.hug .vidhun{opacity:1;transform:translateY(0) scale(.9)}.scene.hug .deena{left:39%;transform:translateX(-7%)}.scene.hug .puppy{left:23%;bottom:20%;transform:scale(1.12)}.scene.hug .deena .arm.r{transform:rotate(-55deg)}.scene.hug .vidhun .arm.l{transform:rotate(55deg)}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:16px}button{border:0;border-radius:28px;padding:13px 22px;font-size:1rem;font-weight:800;color:#75465f;background:linear-gradient(100deg,#f2a4c2,#ffe0b0);cursor:pointer}button.alt{background:#fff8ed}.foot{text-align:center;padding:0 16px 20px;color:#92788c;font-size:.9rem}@media(max-width:560px){.scene{min-height:390px}.person{width:32%;height:48%;bottom:15%}.deena{left:31%}.vidhun{left:67%}.scene.hug .deena{left:36%}.scene.hug .vidhun{left:55%;width:31%}.puppy{left:8%;width:24%;bottom:14%}.phone{left:5%;width:15%;height:17%}.window{left:5%;width:31%}}
</style></head><body><main class="card"><header class="head"><h1>I'm sorry, Deena ♡</h1><p>One hurt feeling, one tiny spirit, one very good puppy.</p></header>
<section class="scene" id="scene"><div class="window"><div class="sun"></div></div><div class="rug"></div><div class="phone" id="phone"></div><div class="caption" id="caption">“This guy has hurt me…”</div>
<div class="person deena"><div class="tag">deena ♡</div><div class="face"><div class="hair"></div><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i><span class="tear" id="tear">💧</span></div><div class="arm l"></div><div class="arm r"></div><div class="body"></div><div class="skirt"></div><div class="leg l"></div><div class="leg r"></div></div>
<div class="person vidhun"><div class="tag">vidhun ✨</div><div class="face"><div class="hair"></div><div class="beard"></div><div class="glasses"><i class="bridge"></i></div><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i></div><div class="arm l"></div><div class="arm r"></div><div class="body"></div><div class="skirt"></div><div class="leg l"></div><div class="leg r"></div></div>
<div class="puppy"><div class="puphead"><i class="ear l"></i><i class="ear r"></i><i class="peye l"></i><i class="peye r"></i><i class="nose"></i><i class="pmouth"></i></div></div><div class="sparkles"></div><span class="heart" style="left:45%;top:35%">♡</span><span class="heart" style="left:64%;top:25%;animation-delay:.7s">✦</span><span class="heart" style="left:52%;top:20%;animation-delay:1.2s">♡</span></section>
<div class="buttons"><button id="play">▶ Play the scene</button><button class="alt" id="again">↻ Play again</button><button class="alt" id="music">♫ Music on</button></div><div class="foot">A tiny animated apology, with love, a hug, and a puppy. ♡</div></main>
<script>
const scene=document.getElementById('scene'),caption=document.getElementById('caption'),phone=document.getElementById('phone'),play=document.getElementById('play'),tear=document.getElementById('tear');let timers=[];
function later(ms,fn){timers.push(setTimeout(fn,ms))}
function reset(){timers.forEach(clearTimeout);timers=[];scene.classList.remove('hug');phone.style.transform='rotate(-17deg) translate(0,0)';phone.style.opacity='1';caption.textContent='“This guy has hurt me…”';tear.style.opacity='0';document.querySelectorAll('.heart').forEach(h=>h.style.opacity='0');play.textContent='▶ Play the scene'}
let audioCtx=null, musicTimer=null, musicStep=0, musicOn=false;
function startCheerfulBgm(){
  if(musicOn) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  audioCtx=audioCtx||new AC();
  if(audioCtx.state==='suspended') audioCtx.resume();
  musicOn=true; musicStep=0;
  const melody=[659.25,783.99,987.77,783.99,880,1046.5,880,783.99,659.25,783.99,880,783.99,587.33,698.46,783.99,698.46];
  const bass=[261.63,329.63,392,329.63,220,277.18,329.63,277.18];
  function tick(){
    if(!musicOn||!audioCtx)return;
    const now=audioCtx.currentTime;
    const note=melody[musicStep%melody.length];
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(note,now);
    gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.075,now+0.025);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.28);
    osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.3);
    if(musicStep%2===0){
      const low=audioCtx.createOscillator(), lg=audioCtx.createGain();
      low.type='triangle';low.frequency.setValueAtTime(bass[Math.floor(musicStep/2)%bass.length],now);
      lg.gain.setValueAtTime(0.0001,now);lg.gain.exponentialRampToValueAtTime(0.035,now+0.03);lg.gain.exponentialRampToValueAtTime(0.0001,now+0.36);
      low.connect(lg);lg.connect(audioCtx.destination);low.start(now);low.stop(now+0.38);
    }
    musicStep++;musicTimer=setTimeout(tick,300);
  }
  tick();
}
function stopCheerfulBgm(){musicOn=false;if(musicTimer)clearTimeout(musicTimer);}
function start(){reset();startCheerfulBgm();play.textContent='Playing…';later(500,()=>{phone.style.transform='rotate(-17deg) translate(-45px,85px)';phone.style.opacity='.18';caption.textContent='Deena throws her phone away in anger…'});later(1900,()=>{caption.textContent='“This guy has hurt me…”';tear.style.opacity='1'});later(3500,()=>{caption.textContent='A little spirit appears…';scene.classList.add('hug')});later(4900,()=>{caption.textContent='“Sorry, Deena. I love you.”';document.querySelectorAll('.heart').forEach(h=>h.style.opacity='1')});later(6500,()=>{caption.textContent='A hug fixes absolutely everything. ♡';tear.style.opacity='0'});later(8000,()=>{caption.textContent='One puppy. One spirit. One happy Deena. ♡';play.textContent='▶ Replay the scene'})}
play.addEventListener('click',start);document.getElementById('again').addEventListener('click',start);
document.getElementById('music').addEventListener('click',()=>{
  const b=document.getElementById('music');
  if(musicOn){stopCheerfulBgm();b.textContent='♫ Music off';}
  else{startCheerfulBgm();b.textContent='♫ Music on';}
});
</script></body></html>
